# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v5

      # Pandoc is required by export.report(): without it the whole file is skipped
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # 'Suggests' are installed by default, hence the packages needed by the tests
      # (pcaMethods, MSnbase, QFeatures, SummarizedExperiment, iq, ...) must NOT be
      # repeated here: a package listed both in DESCRIPTION and in 'extra-packages'
      # gives pak two direct references to reconcile, which currently fails with
      # "$ operator is invalid for atomic vectors".
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            line_exclusions = list(
              "R/zzz.R",
              "R/globals.R",
              "R/options.R"
            ),
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)

          ## uncovered lines per file, most affected first. The columns returned by
          ## zero_coverage() differ between covr versions, hence only 'filename' is used and
          ## the whole report is guarded: a diagnostic must never fail the workflow.
          tryCatch({
            zero <- covr::zero_coverage(cov)
            if (nrow(zero) > 0) {
              cat("\nUncovered lines per file:\n")
              print(sort(table(basename(as.character(zero$filename))), decreasing = TRUE))
            } else {
              cat("\nNo uncovered line.\n")
            }
          }, error = function(e) {message("Could not summarize the uncovered lines: ", conditionMessage(e))})

          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package